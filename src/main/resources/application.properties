spring.application.name=booknest
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:local-development-secret-change-for-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Default admin
app.admin.email=${ADMIN_EMAIL:admin@library.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMeBeforeUse123!}